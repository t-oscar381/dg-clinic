<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F3EC"/>
      <stop offset="1" stop-color="#E6F5F2"/>
    </linearGradient>
    <linearGradient id="fluid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FD4C8"/>
      <stop offset="1" stop-color="#4FBDAE"/>
    </linearGradient>
    <clipPath id="bagInner">
      <rect x="262" y="138" width="276" height="356" rx="38"/>
    </clipPath>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- decorative concentric circles -->
  <circle cx="620" cy="210" r="150" fill="none" stroke="#4FBDAE" stroke-width="3" opacity="0.10"/>
  <circle cx="620" cy="210" r="105" fill="none" stroke="#4FBDAE" stroke-width="3" opacity="0.14"/>
  <circle cx="620" cy="210" r="60" fill="none" stroke="#4FBDAE" stroke-width="3" opacity="0.18"/>
  <circle cx="130" cy="760" r="120" fill="none" stroke="#1E3A5F" stroke-width="3" opacity="0.06"/>

  <!-- hanger -->
  <rect x="396" y="0" width="8" height="92" rx="4" fill="#1E3A5F"/>
  <rect x="368" y="86" width="64" height="38" rx="12" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="8"/>
  <circle cx="400" cy="105" r="7" fill="#F7F3EC" stroke="#1E3A5F" stroke-width="5"/>

  <!-- drip bag -->
  <rect x="250" y="126" width="300" height="380" rx="48" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="10"/>

  <!-- fluid -->
  <g clip-path="url(#bagInner)">
    <path d="M262 302 Q331 282 400 302 T538 302 L538 494 L262 494 Z" fill="url(#fluid)"/>
    <circle cx="330" cy="360" r="9" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="452" cy="410" r="6" fill="#FFFFFF" opacity="0.3"/>
    <circle cx="376" cy="446" r="7" fill="#FFFFFF" opacity="0.25"/>
  </g>

  <!-- graduation marks -->
  <line x1="498" y1="220" x2="526" y2="220" stroke="#1E3A5F" stroke-width="4" opacity="0.35"/>
  <line x1="498" y1="264" x2="526" y2="264" stroke="#1E3A5F" stroke-width="4" opacity="0.35"/>
  <line x1="498" y1="308" x2="526" y2="308" stroke="#1E3A5F" stroke-width="4" opacity="0.35"/>
  <line x1="498" y1="352" x2="526" y2="352" stroke="#1E3A5F" stroke-width="4" opacity="0.35"/>
  <line x1="498" y1="396" x2="526" y2="396" stroke="#1E3A5F" stroke-width="4" opacity="0.35"/>

  <!-- medical plus on label area -->
  <rect x="378" y="212" width="44" height="14" rx="7" fill="#4FBDAE"/>
  <rect x="393" y="197" width="14" height="44" rx="7" fill="#4FBDAE"/>

  <!-- outlet neck -->
  <rect x="384" y="504" width="32" height="44" rx="10" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="8"/>

  <!-- drip chamber -->
  <rect x="374" y="556" width="52" height="96" rx="22" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="8"/>
  <path d="M400 580 c8 13 13 18 13 27 a13 13 0 1 1 -26 0 c0 -9 5 -14 13 -27 z" fill="#4FBDAE"/>
  <ellipse cx="400" cy="634" rx="17" ry="9" fill="#4FBDAE" opacity="0.85"/>

  <!-- tube -->
  <path d="M400 652 C400 752 310 772 280 850 C255 918 330 962 424 986"
        stroke="#1E3A5F" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- soft ground shadow -->
  <ellipse cx="400" cy="944" rx="190" ry="26" fill="#1E3A5F" opacity="0.06"/>
</svg>
